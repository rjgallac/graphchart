apiVersion: 1

datasources:
  - name: Telemetry PostgreSQL
    uid: telemetry-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: $__env{POSTGRES_USER}
    secureJsonData:
      password: $__env{POSTGRES_PASSWORD}
    jsonData:
      database: telemetry
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true

